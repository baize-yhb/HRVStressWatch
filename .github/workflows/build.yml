name: Build iOS + watchOS

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        platform: [iOS, watchOS]
        include:
          - platform: iOS
            scheme: HRVStressWatch
            sdk: iphonesimulator
            destination: 'generic/platform=iOS Simulator'
          - platform: watchOS
            scheme: HRVStressWatch Watch App
            sdk: watchsimulator
            destination: 'generic/platform=watchOS Simulator'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 16
        run: |
          sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer
          xcodebuild -version
          xcrun --show-sdk-path

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Cache SwiftPM/Xcode derived data
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData
            ~/.swiftpm
          key: ${{ runner.os }}-xcode-${{ hashFiles('**/*.swift', 'project.yml') }}
          restore-keys: |
            ${{ runner.os }}-xcode-

      - name: Build
        run: |
          set -o pipefail
          xcodebuild build \
            -project HRVStressWatch.xcodeproj \
            -scheme "${{ matrix.scheme }}" \
            -sdk "${{ matrix.sdk }}" \
            -destination "${{ matrix.destination }}" \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            | tee build.log \
            | xcpretty --color || true

      - name: Show build tail on failure
        if: failure()
        run: tail -200 build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.platform }}
          path: build.log
          retention-days: 7

  package-unsigned:
    name: Package unsigned .app
    needs: build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 16
        run: sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Build device .app (unsigned)
        run: |
          set -o pipefail
          xcodebuild build \
            -project HRVStressWatch.xcodeproj \
            -scheme "HRVStressWatch" \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM=""

      - name: Locate .app bundle
        run: |
          find build -name "*.app" -type d
          APP_PATH=$(find build -name "HRVStressWatch.app" -type d | head -1)
          echo "APP_PATH=$APP_PATH" >> $GITHUB_ENV

      - name: Package as fake-ipa (Payload/*.app)
        run: |
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qry HRVStressWatch-unsigned.ipa Payload
          ls -lh HRVStressWatch-unsigned.ipa

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: HRVStressWatch-unsigned
          path: HRVStressWatch-unsigned.ipa
          retention-days: 30
