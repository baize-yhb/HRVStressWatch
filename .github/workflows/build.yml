name: Build iOS + watchOS

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        platform: [iOS, watchOS]
        include:
          - platform: iOS
            scheme: HRVStressWatch
            sdk: iphonesimulator
            destination: 'generic/platform=iOS Simulator'
          - platform: watchOS
            scheme: HRVStressWatch Watch App
            sdk: watchsimulator
            destination: 'generic/platform=watchOS Simulator'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 16
        run: |
          sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer
          xcodebuild -version
          xcrun --show-sdk-path

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Cache SwiftPM/Xcode derived data
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData
            ~/.swiftpm
          key: ${{ runner.os }}-xcode-${{ hashFiles('**/*.swift', 'project.yml') }}
          restore-keys: |
            ${{ runner.os }}-xcode-

      - name: Build
        run: |
          set -o pipefail
          xcodebuild build \
            -project HRVStressWatch.xcodeproj \
            -scheme "${{ matrix.scheme }}" \
            -sdk "${{ matrix.sdk }}" \
            -destination "${{ matrix.destination }}" \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            2>&1 | tee build.log

      - name: Show build tail on failure
        if: failure()
        run: |
          echo "===== LAST 300 LINES ====="
          tail -300 build.log
          echo "===== ERROR/WARNING GREP ====="
          grep -E "(error:|warning:|Command .* failed)" build.log | head -50 || true

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.platform }}
          path: build.log
          retention-days: 7

  package-unsigned:
    name: Package unsigned device .app
    needs: build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 16
        run: sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Build device Watch App (unsigned, watchos SDK)
        run: |
          set -o pipefail
          xcodebuild build \
            -project HRVStressWatch.xcodeproj \
            -target "HRVStressWatch Watch App" \
            -sdk watchos \
            -configuration Release \
            -derivedDataPath build-watch \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_ENTITLEMENTS="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            DEVELOPMENT_TEAM="" \
            ENABLE_BITCODE=NO \
            2>&1 | tee watch-device-build.log

      - name: Build device iOS App (unsigned, iphoneos SDK)
        run: |
          set -o pipefail
          xcodebuild build \
            -project HRVStressWatch.xcodeproj \
            -target "HRVStressWatch" \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build-ios \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_ENTITLEMENTS="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            DEVELOPMENT_TEAM="" \
            ENABLE_BITCODE=NO \
            2>&1 | tee device-build.log

      - name: Show device build tail on failure
        if: failure()
        run: |
          echo "===== IOS BUILD TAIL ====="
          tail -200 device-build.log 2>/dev/null || echo "no ios log"
          echo "===== WATCH BUILD TAIL ====="
          tail -200 watch-device-build.log 2>/dev/null || echo "no watch log"
          echo "===== ERROR GREP ====="
          grep -E "(error:|Command .* failed|Provisioning|Entitlement|Signing)" device-build.log watch-device-build.log 2>/dev/null | head -80 || true

      - name: Upload device build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: device-build-log
          path: |
            device-build.log
            watch-device-build.log
          retention-days: 7

      - name: Merge Watch App into iOS bundle
        run: |
          set -e
          IOS_APP=$(find build-ios/Build/Products/Release-iphoneos -maxdepth 1 -name "HRVStressWatch.app" -type d | head -1)
          WATCH_APP=$(find build-watch/Build/Products/Release-watchos -maxdepth 1 -name "*.app" -type d | head -1)

          if [ -z "$IOS_APP" ]; then echo "ERROR: iOS .app not found"; find build-ios -name "*.app"; exit 1; fi
          if [ -z "$WATCH_APP" ]; then echo "ERROR: Watch .app not found"; find build-watch -name "*.app"; exit 1; fi

          echo "iOS App:   $IOS_APP"
          echo "Watch App: $WATCH_APP"

          mkdir -p "$IOS_APP/Watch"
          cp -R "$WATCH_APP" "$IOS_APP/Watch/"

          echo "===== MERGED BUNDLE ====="
          ls -la "$IOS_APP"
          echo "===== Watch/ subdir ====="
          ls -la "$IOS_APP/Watch/"
          echo "===== Watch App contents ====="
          ls -la "$IOS_APP/Watch/$(basename "$WATCH_APP")"

          echo "IOS_APP=$IOS_APP" >> $GITHUB_ENV

      - name: Package as fake-ipa (Payload/*.app)
        run: |
          mkdir -p Payload
          cp -R "$IOS_APP" Payload/
          zip -qry HRVStressWatch-unsigned.ipa Payload
          ls -lh HRVStressWatch-unsigned.ipa
          echo "===== IPA CONTENTS (top level) ====="
          unzip -l HRVStressWatch-unsigned.ipa | head -20
          echo "===== Watch App presence check ====="
          unzip -l HRVStressWatch-unsigned.ipa | grep -E "Watch/.*\.app/" | head -5 || (echo "ERROR: Watch App not in ipa"; exit 1)

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: HRVStressWatch-unsigned
          path: HRVStressWatch-unsigned.ipa
          retention-days: 30
