name: Build iOS + watchOS

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        platform: [iOS, watchOS]
        include:
          - platform: iOS
            scheme: HRVStressWatch
            sdk: iphonesimulator
            destination: 'generic/platform=iOS Simulator'
          - platform: watchOS
            scheme: HRVStressWatch Watch App
            sdk: watchsimulator
            destination: 'generic/platform=watchOS Simulator'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 16
        run: |
          sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer
          xcodebuild -version
          xcrun --show-sdk-path

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Cache SwiftPM/Xcode derived data
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData
            ~/.swiftpm
          key: ${{ runner.os }}-xcode-${{ hashFiles('**/*.swift', 'project.yml') }}
          restore-keys: |
            ${{ runner.os }}-xcode-

      - name: Build
        run: |
          set -o pipefail
          xcodebuild build \
            -project HRVStressWatch.xcodeproj \
            -scheme "${{ matrix.scheme }}" \
            -sdk "${{ matrix.sdk }}" \
            -destination "${{ matrix.destination }}" \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            2>&1 | tee build.log

      - name: Show build tail on failure
        if: failure()
        run: |
          echo "===== LAST 300 LINES ====="
          tail -300 build.log
          echo "===== ERROR/WARNING GREP ====="
          grep -E "(error:|warning:|Command .* failed)" build.log | head -50 || true

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.platform }}
          path: build.log
          retention-days: 7

  package-unsigned:
    name: Package unsigned device .app
    needs: build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 16
        run: sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Build device .app (unsigned, no entitlements)
        run: |
          set -o pipefail
          xcodebuild build \
            -project HRVStressWatch.xcodeproj \
            -scheme "HRVStressWatch" \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_ENTITLEMENTS="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            DEVELOPMENT_TEAM="" \
            ENABLE_BITCODE=NO \
            2>&1 | tee device-build.log

      - name: Show device build tail on failure
        if: failure()
        run: |
          echo "===== LAST 300 LINES ====="
          tail -300 device-build.log
          echo "===== ERROR/WARNING GREP ====="
          grep -E "(error:|Command .* failed|Provisioning|Entitlement|Signing)" device-build.log | head -80 || true

      - name: Upload device build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: device-build-log
          path: device-build.log
          retention-days: 7

      - name: Locate .app bundles
        run: |
          echo "===== ALL .app BUNDLES ====="
          find build -name "*.app" -type d
          APP_PATH=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "HRVStressWatch.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find build -name "HRVStressWatch.app" -type d | head -1)
          fi
          echo "APP_PATH=$APP_PATH" >> $GITHUB_ENV
          echo "Selected: $APP_PATH"
          ls -la "$APP_PATH" | head -30

      - name: Package as fake-ipa (Payload/*.app)
        run: |
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qry HRVStressWatch-unsigned.ipa Payload
          ls -lh HRVStressWatch-unsigned.ipa
          echo "===== IPA CONTENTS ====="
          unzip -l HRVStressWatch-unsigned.ipa | head -30

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: HRVStressWatch-unsigned
          path: HRVStressWatch-unsigned.ipa
          retention-days: 30
